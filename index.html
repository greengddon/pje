<!-- 포트폴리오 영상 -->
<div class="video-container">

    <video
        id="portfolioVideo"
        muted
        playsinline
        preload="auto"
        loop
    >
        <source src="img/h.mp4" type="video/mp4">
    </video>

    <!-- 재생 / 일시정지 버튼 -->
    <button
        id="videoControl"
        class="video-control"
        type="button"
        aria-label="영상 일시정지"
    >❚❚</button>

</div>


<script>
document.addEventListener('DOMContentLoaded', function () {

    const video = document.getElementById('portfolioVideo');
    const button = document.getElementById('videoControl');

    let manuallyPaused = false;

    // 버튼 모양 변경
    function updateButton() {
        if (video.paused) {
            button.textContent = '▶';
            button.setAttribute('aria-label', '영상 재생');
        } else {
            button.textContent = '❚❚';
            button.setAttribute('aria-label', '영상 일시정지');
        }
    }

    // 영상 재생 함수
    function playVideo() {
        video.play().catch(error => {
            console.error('영상 재생 실패:', error);
        });
    }

    // 재생 / 일시정지 버튼 클릭
    button.addEventListener('click', function () {

        if (video.paused) {
            manuallyPaused = false;
            playVideo();
        } else {
            manuallyPaused = true;
            video.pause();
        }

        updateButton();
    });

    // 스크롤에 따른 자동 재생 / 정지
    const observer = new IntersectionObserver((entries) => {

        entries.forEach(entry => {

            if (entry.isIntersecting) {

                if (!manuallyPaused) {
                    playVideo();
                }

            } else {

                video.pause();
                manuallyPaused = false;

            }

        });

    }, {
        threshold: 0.1
    });

    observer.observe(video);

    // 재생 상태에 맞춰 버튼 변경
    video.addEventListener('play', updateButton);
    video.addEventListener('pause', updateButton);

    updateButton();

});
</script>
