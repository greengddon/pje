<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            background-color: rgb(245, 233, 218);
            font-family: "맑은 고딕", sans-serif;
        }

        .header{
            background-color: aliceblue;
            color: black;
            padding: 30px;/* 안쪽여백 */
            text-align: center;
        }

        .menu {
            background-color: rgb(134, 195, 235);
            padding: 20px;/* 박스 안쪽여백 */
            text-align: center;
        }/* 메뉴 박스에 대하여 */

        .menu a:hover{/* 마우스를 올렸을때 변하는 액션값 */
            color: rgb(255, 255, 255);
        }
        .menu a{
            color: #333333;/* 링크한 문자에 컬러 변경하기 */
            text-decoration: none;/* 링크한 문자에 밑줄 없애기 */
        }/* 메뉴 박스 안에 있는 링크 a에 대하여 */

        .content{
            max-width: 1200px;
            margin: 30px auto;/* 위아래는 30px, auto 좌우는 가운데 정렬 */
            padding: 30px;/* 안쪽 여백 30 */
            background-color: white;/* 배경색 흰색 */
            text-align: center;/* 문자 가운데 정렬 */
        }
        .content img{
            width: 100%;/* 이미지 사이즈 위 콘텐츠박스 크기 맞춰서 100% 채우기 */ 
        }
        .button{
            display: inline-block;/* 문자 외형 박스로 인식해라! */
            background-color: #333333;/* 박스 배경색 333색 */
            color: white;/* 박스 안에 문자 흰색 */
            padding: 12px 30px;/* 박스 안에 여백주어 문자 여유있게 보이도록 설정 */
            text-decoration: none;/* 링크상 생기는 밑줄 없애기! */
        }
        .button:hover{
            background-color: orange;
        }
        .footer{
            background-color: aquamarine;
            color: black;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>my web page</h1>
        <p>나의 첫 번째 웹페이지입니다.</p>
    </div>

    <div class="menu">
        <a href="https://heyzine.com/flip-book/bb29975618.html" target="_blank">헤이진</a>
        <a href="https://greengddon.github.io/pje/" target="_blank">깃허브</a>
        <a href="">PDF</a>
    </div>

    <div class="content">
        <h2>안녕하세요!</h2>
        <p>그린컴 포트폴리오 페이지입니다.</p>
        <img src="img/good2.jpg" alt="홈페이지 대문이미지 입니다.">
        <a href="https://greengddon.github.io/pje/" target="_blank"
        class="button">바로가기</a>
    </div>

    <div class="footer">
        <p>Copyright 2026. All Rights Reserved.</p>
    </div>
</body>
</html>
